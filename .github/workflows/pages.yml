name: Deploy documentation

on:
  # Documentation is deployed manually from the Actions tab by default.
  # To deploy automatically after pushes to selected branches, uncomment and
  # add, remove, or customize the branch patterns as needed:
  # push:
  #   branches:
  #     - main
  #     # - docs
  #     # - release/*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Set up documentation environment
        run: bundle exec rake docs:setup

      - name: Build documentation
        run: |
          bundle exec rake docs:build -- \
            --site-dir "${{ runner.temp }}/wifiwand-site"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/wifiwand-site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
